# drop-test spec: valkey (redis-compatible) minimum Linux capabilities, default
# root-then-drop invocation with NO data volume — the exact scope of the published
# catalog profile (catalog/docker.io/valkey/valkey.yaml run_config: no mounts, no
# env, no-new-privileges). Baseline is cap_drop:ALL + the full Docker default cap
# set.
#
# The entrypoint starts as root and drops to the valkey user (uid 999) via
# `setpriv` — SETUID/SETGID are STARTUP caps, dropping either fails the drop and
# the container exits. With no data volume, valkey uses the image's own pre-owned
# /data, so nothing is chowned and CHOWN comes out NOT required. That is a
# documented invocation dependence, not an error: immich's deployment (read_only +
# a fresh root-owned tmpfs /data) DOES need CHOWN back — that invocation is
# covered by deploy-check/manifest.yaml (immich-redis), never by this spec. Keep
# the two scopes distinct; see the false-CHOWN lesson on the deploy-check entry.
#
# Correctness reuses redis_deploy.sh: it is invocation-agnostic — auth-aware when
# the container's configured argv carries --requirepass, plain PING otherwise
# (this spec's invocation has no auth) — and asserts PING + SET/GET + a non-root
# server uid.
image: docker.io/valkey/valkey
tag: "9"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  security_opt: ["no-new-privileges:true"]
correctness: testdata/drop-test/correctness/redis_deploy.sh

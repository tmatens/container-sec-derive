# drop-test spec: postgres minimum capabilities under a `user:`-set invocation —
# the A/B pair of postgres-caps.yaml for the invocation→requirement study
# (issue #236, docs/invocation-map.md). NOT a catalog profile source: the
# published postgres profile stays the conservative default-invocation
# (root-then-drop) superset; this spec exists to derive the OTHER side of the
# `user:` axis with everything else held equal.
#
# With `user: postgres` the entrypoint never runs its root phase: no gosu
# re-exec (SETUID/SETGID unused), no chown of the data dir or the tmpfs socket
# dir (CHOWN unused — the socket dir works because docker's tmpfs default mode
# is 1777), initdb runs directly as postgres against the declared VOLUME (which
# inherits postgres ownership from the image). Expected minimum: [] — every
# Docker-default cap removable. Same read_only+tmpfs sibling config, same
# workload + non-root assert as the default-invocation spec.
image: docker.io/library/postgres
tag: "16"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  user: postgres
  read_only: true
  tmpfs: ["/run/postgresql"]
  env: ["POSTGRES_PASSWORD=postgres"]
correctness: testdata/drop-test/correctness/postgres-caps.sh

# Live-BPF integration tests — observe real running containers.
#
# ci.yml covers vet/test/build and the fixture-replay path (no kernel).
# image-build.yml smokes the container image in fixture mode. Neither
# exercises the load-bearing claim of the tool: that `ig`'s
# trace_capabilities kprobe+kretprobe actually attaches and csd records
# the caps a live container exercises. This workflow closes that gap by
# running scripts/smoke_wsl2.sh — the existing, host-agnostic harness
# (PLAN.md §Platform support / v1 success criterion 504) — against the
# four reference workloads on a GitHub-hosted ubuntu-24.04 runner.
#
# Runner fit: GitHub-hosted ubuntu-24.04 is a full VM (not a container),
# so it carries a modern kernel, BTF at /sys/kernel/btf/vmlinux, and
# root via sudo — what CAP_BPF + CAP_PERFMON observation needs. BPF
# attach on hosted runners is plausible (IG's own CI loads BPF there)
# but NOT assumed: the first run is a `workflow_dispatch` confirmation.
# If cap_capable cannot attach on the runner kernel, smoke_wsl2.sh
# reports it as a per-image FAIL ("BPF did not attach … check kernel
# BTF") rather than a green pass — that failure is itself the signal to
# move this job to a self-hosted runner (see PLAN.md / ROADMAP).
#
# Triggers: pull_request + nightly schedule + workflow_dispatch (NOT
# push-to-main). Live observation burns hosted minutes, so the per-PR run is
# TRIMMED: synthetic-only hard gate at a short 10s window (the deterministic
# exercisers fire within ~1-2s of attach; the 500ms init-window plus a few cycles
# fit easily). The broader reference workloads (postgres/caddy/tailscale, which
# are informational and often observe zero events post-attach) run at the full
# 30s window on the NIGHTLY schedule and on dispatch — see the smoke job's env.
# Dropping the redundant post-merge push run keeps the free-tier 2,000 min/month
# budget for PRs. The bisection job (make ground-truth-*, ~5-8 min PER image) is
# workflow_dispatch-only for the same reason — it must never run per-PR.
#
# All third-party actions SHA-pinned per CLAUDE.md §Dependency pinning;
# SHAs are kept in lockstep with ci.yml / image-build.yml / release.yml.
name: integration

on:
  pull_request:
    branches: [main]
    # Skip the live BPF smoke (~5-8 min) on changes that can't affect the
    # observer: docs, the Renovate config, license. Anything else (Go code,
    # workflows, scripts, testdata) still runs it. workflow_dispatch is
    # unaffected and always runs.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'renovate.json'
      - 'LICENSE'
  schedule:
    # Every-3-days FULL run: the reference workloads (postgres/caddy/tailscale)
    # at the full 30s window AND the arm64 live-BPF lane (per-PR is amd64-only +
    # synthetic-only + 10s for speed — see the smoke job's matrix/env). This
    # scheduled run is where the broader reference + arm64 coverage lives.
    - cron: "41 5 */3 * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Per-image observation window (Go duration, e.g. 30s)"
        required: false
        default: "30s"
      bisect_image:
        description: "Run make ground-truth-<image> and upload the result for diff (none = skip bisection)"
        required: false
        default: "none"
        type: choice
        options: [none, postgres, caddy, tailscale, all]
      run_missrate:
        description: "Run the kretprobe miss-rate (capture-deficit) measurement"
        required: false
        default: false
        type: boolean
      iters:
        description: "Counted cycles for the miss-rate run (CHOWN events = 2x this)"
        required: false
        default: "20000"

permissions:
  contents: read
  pull-requests: write # post the allowlisted diagnostic report as a PR comment

# Cancel a superseded live-BPF run when a PR is pushed again — this is the
# priciest job (~7 min), so cancelling stale runs saves the most (#143).
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Live observe → assert. Hard gates: postgres (attach proof — events
  # recorded > 0; observed set may be empty per docs/known-deltas.md) and
  # synthetic (derived caps ⊇ expected_caps_minimum). caddy/tailscale are
  # informational — their privileged ops happen pre-attach, so zero events
  # is expected and must not fail the build (see scripts/smoke_wsl2.sh).
  smoke:
    name: live-bpf smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # Per-PR runs are trimmed for Actions cost; scheduled/dispatch runs go broad.
    # A dispatch `duration` input overrides the window everywhere. The PR window
    # (10s, closed-loop 15s) comfortably exceeds gadget attach + the 500ms
    # init-window + several exercise cycles, so the deterministic gates still fire;
    # SMOKE_ONLY restricts caps/fs to the synthetic hard gate (the reference
    # workloads are informational and run on the every-3-days schedule).
    #
    # Runner matrix: per-PR runs amd64 only (the cheap, fast gate). The
    # scheduled/dispatch runs add a native ubuntu-24.04-arm leg so the eBPF
    # attach/parse path is validated on arm64 too — we ship a signed arm64
    # binary + image, so the runtime path must be proven, not just compiled.
    # fail-fast:false so an arm64-only flake doesn't void the amd64 result.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ (github.event_name == 'pull_request') && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    env:
      SMOKE_DURATION: ${{ github.event.inputs.duration || (github.event_name == 'pull_request' && '10s' || '30s') }}
      SMOKE_DURATION_CL: ${{ github.event.inputs.duration || (github.event_name == 'pull_request' && '15s' || '30s') }}
      SMOKE_ONLY: ${{ github.event_name == 'pull_request' && 'synthetic' || 'postgres,caddy,tailscale,synthetic' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth for the ig version: internal/ig/ig.go's
      # PinnedIGVersion, same extraction as image-build.yml. csd also
      # enforces this pin at runtime (ExitSchemaMismatch on mismatch),
      # so installing the wrong version here surfaces as a smoke FAIL.
      - name: Resolve pinned ig version
        id: vars
        run: |
          ig_version="$(awk -F'"' '/^[[:space:]]+PinnedIGVersion[[:space:]]+=/ {print $2; exit}' internal/ig/ig.go)"
          if [ -z "${ig_version}" ]; then
            echo "::error::could not extract PinnedIGVersion from internal/ig/ig.go"
            exit 1
          fi
          echo "ig_version=${ig_version}" >> "$GITHUB_OUTPUT"

      # Fetch + verify ig against the committed supply-chain pin, exactly
      # as the Dockerfile builder stage does: download the per-arch
      # tarball from the IG release, check its sha256 against the line in
      # ig-pin/SHA256SUMS (signed at pin-bump time by refresh-ig-pin.sh),
      # then install to /usr/local/bin (on sudo's secure_path). No
      # fallback download path — a digest miss fails the job.
      - name: Install pinned ig (per-arch, verified against ig-pin/SHA256SUMS)
        env:
          IG_VERSION: ${{ steps.vars.outputs.ig_version }}
        run: |
          set -euo pipefail
          # ig ships per-arch tarballs; pick by the runner's arch so the arm64
          # leg installs arm64 ig. dpkg's arch names (amd64/arm64) match ig's
          # artifact naming exactly, and ig-pin/SHA256SUMS carries both digests.
          arch="$(dpkg --print-architecture)"
          artifact="ig-linux-${arch}-${IG_VERSION}.tar.gz"
          url="https://github.com/inspektor-gadget/inspektor-gadget/releases/download/${IG_VERSION}/${artifact}"
          curl -fsSL "${url}" -o "/tmp/${artifact}"
          line="$(grep -E "  ${artifact}\$" ig-pin/SHA256SUMS || true)"
          if [ -z "${line}" ]; then
            echo "::error::no digest for ${artifact} in ig-pin/SHA256SUMS — bump PinnedIGVersion and run scripts/refresh-ig-pin.sh"
            exit 1
          fi
          ( cd /tmp && printf '%s\n' "${line}" | sha256sum -c - )
          tar -C /tmp -xzf "/tmp/${artifact}" ig
          sudo install -m 0755 /tmp/ig /usr/local/bin/ig
          ig version

      - name: Build csd
        run: go build -o csd ./cmd/csd

      # Fixed-fact preflight so a failure self-classifies (BTF absent →
      # CO-RE can't attach; ig version mismatch → SchemaMismatch). These
      # are hard-coded facts, NOT an env dump — no secrets can appear.
      - name: Preflight (kernel / BTF / ig)
        run: |
          {
            echo "preflight: arch=$(uname -m)"
            echo "preflight: kernel=$(uname -r)"
            if [ -e /sys/kernel/btf/vmlinux ]; then
              echo "preflight: BTF=present"
            else
              echo "preflight: BTF=ABSENT (cap_capable CO-RE cannot attach)"
            fi
            echo "preflight: ig=$(ig version 2>&1 | head -1)"
          } | tee preflight.txt

      # jq + docker are preinstalled on ubuntu-24.04 runners. Run the
      # matrix under sudo so csd can load BPF (CAP_BPF/CAP_PERFMON) and
      # reach the docker socket; sudo's secure_path resolves
      # /usr/local/bin/ig and /usr/bin/jq. cwd is preserved, so the
      # script's $(pwd)-relative workload paths resolve correctly.
      # Output is teed to smoke.txt for the report step; a nonzero exit
      # still fails the job (the gate), and always() lets the report run.
      - name: Live-BPF smoke matrix
        env:
          DURATION: ${{ env.SMOKE_DURATION }}
          ONLY: ${{ env.SMOKE_ONLY }}
        run: |
          # Capture the real exit code: `cmd | tee` masks failure (the
          # pipeline exit becomes tee's 0), which would let a FAIL pass green.
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" "ONLY=${ONLY}" \
            scripts/smoke_wsl2.sh > smoke.txt 2>&1 && rc=0 || rc=$?
          cat smoke.txt
          exit $rc

      # First end-to-end exercise of the v0.2 trace_open (--observe fs) path
      # on real containers — the fixture-replay unit tests can't cover ig
      # attach + write capture. Same sudo/secure_path/exit-code-capture
      # pattern as the cap smoke. Hard gate: the synthetic exerciser, which
      # opens /csd-exerciser-target O_CREAT|O_WRONLY|O_TRUNC every cycle, must
      # appear in the derived writable_paths (scripts/smoke_fs.sh).
      # postgres/caddy/tailscale are informational (writes happen largely
      # pre-attach, per docs/known-deltas.md).
      - name: Live-BPF fs smoke matrix
        env:
          DURATION: ${{ env.SMOKE_DURATION }}
          ONLY: ${{ env.SMOKE_ONLY }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" "ONLY=${ONLY}" \
            scripts/smoke_fs.sh > smoke_fs.txt 2>&1 && rc=0 || rc=$?
          cat smoke_fs.txt
          exit $rc

      # First end-to-end exercise of the v0.3 device-decomposition
      # (--observe devices) and privileged-mode decomposition
      # (--observe privileged) observers. The device observer reuses the
      # trace_open gadget (attach already proven by the fs smoke above); what
      # this adds is the device classifier on a real stream and the privileged
      # composition's CONCURRENT two-gadget live path (trace_capabilities +
      # trace_open in one window). Hardware-free hard gate: the synthetic
      # exerciser is run with a mapped non-default /dev node
      # (--device /dev/null:/dev/csd-exerciser-dev) it opens every cycle, so no
      # GPU/tun/kvm is needed on the runner (scripts/smoke_device.sh).
      - name: Live-BPF device smoke matrix
        env:
          DURATION: ${{ env.SMOKE_DURATION }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" \
            scripts/smoke_device.sh > smoke_device.txt 2>&1 && rc=0 || rc=$?
          cat smoke_device.txt
          exit $rc

      # v0.5 dangerous-cap_add validator (--observe capadd). Reuses the
      # trace_capabilities gadget (attach already proven by the caps smoke
      # above); what this adds is the per-cap syscall correlation and the
      # unused->removable classification on a real stream. Hardware-free hard
      # gate: the synthetic exerciser deterministically fires held
      # CHOWN/SETUID/SETGID checks, so validating those plus an unused
      # SYS_MODULE must report CHOWN used and SYS_MODULE removable
      # (scripts/smoke_capadd.sh).
      - name: Live-BPF capadd smoke
        env:
          DURATION: ${{ env.SMOKE_DURATION }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" \
            scripts/smoke_capadd.sh > smoke_capadd.txt 2>&1 && rc=0 || rc=$?
          cat smoke_capadd.txt
          exit $rc

      # v0.8 network-egress observer (--observe egress). The new attach is
      # trace_tcp; fixture replay can't prove the live tcpEvent parser handles a
      # real trace_tcp stream. Hardware-free, no external network: a stock alpine
      # container TCP-connects to its own docker gateway on a fixed port in a
      # loop (connect() fires whether or not the port listens), so the egress
      # observation must contain that <gateway>:<port> (scripts/smoke_egress.sh).
      - name: Live-BPF egress smoke
        env:
          DURATION: ${{ env.SMOKE_DURATION }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" \
            scripts/smoke_egress.sh > smoke_egress.txt 2>&1 && rc=0 || rc=$?
          cat smoke_egress.txt
          exit $rc

      # Closed-loop "meets intent" test (scripts/closed_loop.sh). The only gate
      # that validates csd's OUTPUT, not just its pipeline: derive a cap profile,
      # re-run the workload under exactly that profile (must succeed = sufficient),
      # then with all caps dropped (must fail = necessary). Hardware-free; the
      # derive phase reuses trace_capabilities (attach already proven above).
      - name: Closed-loop meets-intent test
        env:
          DURATION: ${{ env.SMOKE_DURATION_CL }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" \
            scripts/closed_loop.sh > closed_loop.txt 2>&1 && rc=0 || rc=$?
          cat closed_loop.txt
          exit $rc

      # Route the verdict to channels readable WITHOUT the Actions log
      # API (which is unreachable from some clients): a PR comment +
      # the job summary. SECURITY: the report is a strict ALLOWLIST —
      # the fixed preflight facts plus the smoke script's own
      # PASS/FAIL/INFO/summary lines, extracted by grep. It never echoes
      # env, secrets, tokens, docker-pull noise, or raw workload logs, so
      # no sensitive data leaves the runner. The only credential used is
      # the ephemeral, scoped GITHUB_TOKEN, which is never printed.
      - name: Post diagnostic report (allowlisted, no secrets)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- csd-integration-report -->'
          # Allowlist: fixed preflight facts + known-safe status lines.
          # Anything not matching these prefixes (env, logs, noise) is dropped.
          report="$( { cat preflight.txt 2>/dev/null || true; \
                       echo '-- caps observer --'; \
                       grep -hE '^(PASS|FAIL|INFO|smoke-wsl2:)' smoke.txt 2>/dev/null || true; \
                       echo '-- fs observer --'; \
                       grep -hE '^(PASS|FAIL|INFO|smoke-fs:)' smoke_fs.txt 2>/dev/null || true; \
                       echo '-- devices / privileged observer --'; \
                       grep -hE '^(PASS|FAIL|INFO|smoke-device:)' smoke_device.txt 2>/dev/null || true; \
                       echo '-- capadd observer --'; \
                       grep -hE '^(PASS|FAIL|INFO|smoke-capadd:)' smoke_capadd.txt 2>/dev/null || true; \
                       echo '-- egress observer --'; \
                       grep -hE '^(PASS|FAIL|INFO|smoke-egress:)' smoke_egress.txt 2>/dev/null || true; \
                       echo '-- closed-loop (meets intent) --'; \
                       grep -hE '^(PASS|FAIL|INFO|closed-loop:)' closed_loop.txt 2>/dev/null || true; } )"
          [ -n "$report" ] || report="(no status lines captured — see the Actions run)"
          { echo "### Live-BPF integration report";
            echo "[run](${RUN_URL})";
            echo '```'; echo "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # PR comment is the machine-readable channel; skip on dispatch (no PR).
          [ -n "${PR:-}" ] || { echo "no PR context; job summary only"; exit 0; }
          body="$(printf '%s\n### Live-BPF integration report\n[run](%s) · commit `%s`\n\n```\n%s\n```\n' \
                  "$marker" "$RUN_URL" "${GITHUB_SHA:0:9}" "$report")"
          api="https://api.github.com"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          # Upsert: update the existing report comment if present, else create one.
          existing="$(curl -fsS "${auth[@]}" "$api/repos/$REPO/issues/$PR/comments?per_page=100" \
                      | jq -r --arg m "$marker" '[.[] | select(.body|contains($m))][0].id // empty')"
          jq -nc --arg b "$body" '{body:$b}' > payload.json
          if [ -n "$existing" ]; then
            curl -fsS -X PATCH "${auth[@]}" "$api/repos/$REPO/issues/comments/$existing" -d @payload.json >/dev/null
            echo "updated comment $existing"
          else
            curl -fsS -X POST "${auth[@]}" "$api/repos/$REPO/issues/$PR/comments" -d @payload.json >/dev/null
            echo "created comment"
          fi

  # kretprobe miss-rate (capture deficit) — closes the v1 Correctness
  # criterion that wants the miss rate measured, not assumed. Runs the
  # synthetic exerciser in counting mode and compares csd's recorded
  # per-cap event counts to the exerciser's exact issued counts.
  #
  # Dispatch-only (expensive live BPF, ~3-5 min): run from the Actions tab
  # with run_missrate=true. Validated against this harness's own PR (the
  # synthetic exerciser measured 0.0000% capture deficit over 100k events);
  # not run per-PR to conserve free-tier minutes.
  missrate:
    name: kretprobe miss-rate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_missrate == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve pinned ig version
        id: vars
        run: |
          ig_version="$(awk -F'"' '/^[[:space:]]+PinnedIGVersion[[:space:]]+=/ {print $2; exit}' internal/ig/ig.go)"
          if [ -z "${ig_version}" ]; then
            echo "::error::could not extract PinnedIGVersion from internal/ig/ig.go"
            exit 1
          fi
          echo "ig_version=${ig_version}" >> "$GITHUB_OUTPUT"

      - name: Install pinned ig (per-arch, verified against ig-pin/SHA256SUMS)
        env:
          IG_VERSION: ${{ steps.vars.outputs.ig_version }}
        run: |
          set -euo pipefail
          # ig ships per-arch tarballs; pick by the runner's arch so the arm64
          # leg installs arm64 ig. dpkg's arch names (amd64/arm64) match ig's
          # artifact naming exactly, and ig-pin/SHA256SUMS carries both digests.
          arch="$(dpkg --print-architecture)"
          artifact="ig-linux-${arch}-${IG_VERSION}.tar.gz"
          url="https://github.com/inspektor-gadget/inspektor-gadget/releases/download/${IG_VERSION}/${artifact}"
          curl -fsSL "${url}" -o "/tmp/${artifact}"
          line="$(grep -E "  ${artifact}\$" ig-pin/SHA256SUMS || true)"
          if [ -z "${line}" ]; then
            echo "::error::no digest for ${artifact} in ig-pin/SHA256SUMS"
            exit 1
          fi
          ( cd /tmp && printf '%s\n' "${line}" | sha256sum -c - )
          tar -C /tmp -xzf "/tmp/${artifact}" ig
          sudo install -m 0755 /tmp/ig /usr/local/bin/ig

      - name: Build csd
        run: go build -o csd ./cmd/csd

      - name: Measure kretprobe miss-rate
        env:
          ITERS: ${{ github.event.inputs.iters || '20000' }}
        run: |
          # Capture the real exit code (see the smoke job) so a FAIL gates.
          sudo env "CSD=$PWD/csd" "ITERS=${ITERS}" \
            scripts/kretprobe_missrate.sh > missrate.txt 2>&1 && rc=0 || rc=$?
          cat missrate.txt
          exit $rc

      # Same allowlisted self-report as the smoke job: MISSRATE/PASS/FAIL
      # status lines only — no env, secrets, or raw logs.
      - name: Post miss-rate report (allowlisted, no secrets)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- csd-missrate-report -->'
          report="$( grep -hE '^(MISSRATE|PASS|FAIL)' missrate.txt 2>/dev/null || true )"
          [ -n "$report" ] || report="(no MISSRATE lines captured — see the Actions run)"
          { echo "### kretprobe miss-rate report";
            echo "[run](${RUN_URL})";
            echo '```'; echo "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -n "${PR:-}" ] || { echo "no PR context; job summary only"; exit 0; }
          body="$(printf '%s\n### kretprobe miss-rate report\n[run](%s) · commit `%s`\n\n```\n%s\n```\n' \
                  "$marker" "$RUN_URL" "${GITHUB_SHA:0:9}" "$report")"
          api="https://api.github.com"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          existing="$(curl -fsS "${auth[@]}" "$api/repos/$REPO/issues/$PR/comments?per_page=100" \
                      | jq -r --arg m "$marker" '[.[] | select(.body|contains($m))][0].id // empty')"
          jq -nc --arg b "$body" '{body:$b}' > payload.json
          if [ -n "$existing" ]; then
            curl -fsS -X PATCH "${auth[@]}" "$api/repos/$REPO/issues/comments/$existing" -d @payload.json >/dev/null
            echo "updated comment $existing"
          else
            curl -fsS -X POST "${auth[@]}" "$api/repos/$REPO/issues/$PR/comments" -d @payload.json >/dev/null
            echo "created comment"
          fi

  # On-demand bisection reproducibility check. Regenerates ground truth
  # for the chosen image(s) and uploads the JSON as an artifact for a
  # human to diff against the committed testdata/<image>/ground_truth.json
  # — it does NOT commit. Bisection does not use BPF (it restarts the
  # container under shrinking --cap-drop sets and lets the kernel be the
  # validator), but it does need docker, hence sudo.
  bisect:
    name: bisection (${{ github.event.inputs.bisect_image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.bisect_image != 'none'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run bisection → out/
        env:
          TARGET: ${{ github.event.inputs.bisect_image }}
        run: |
          set -euo pipefail
          mkdir -p out
          run_one() {
            name="$1"
            echo "::group::bisect ${name}"
            sudo make "ground-truth-${name}"
            cp "testdata/${name}/ground_truth.json" "out/${name}-ground_truth.json"
            echo "::endgroup::"
          }
          if [ "${TARGET}" = "all" ]; then
            for n in postgres caddy tailscale; do run_one "$n"; done
          else
            run_one "${TARGET}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bisection-ground-truth
          path: out/*.json
          if-no-files-found: error

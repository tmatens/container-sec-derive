# deploy-check manifest — the homelab services checked by deploy-check.yml.
#
# For each entry the job clones the service's LIVE compose from Forgejo and runs
# scripts/compose_derive.sh against it: derive the capability minimum under the
# service's OWN invocation (on the posture-matched runner) and diff it against
# the declared cap_add. Verdicts land in the job summary; under ENFORCE=1 (the
# scheduled job) an under_permissioned service fails the run, while
# over_permissioned / not_minimized stay advisory.
#
# `correctness` is a repo-relative correctness check (the per-service "still works
# CORRECTLY" bar). A weak check under-derives, so only services with a real one
# belong here. `compose_path` and `service` locate the service inside the repo.
services:
  - name: netdata
    forgejo_repo: netdata
    compose_path: docker-compose.yml
    service: netdata
    correctness: testdata/drop-test/correctness/netdata.sh

  # Homepage runs as `user: 1000:1000` — the owner of its ./config bind on the
  # deploy target. A fresh clone owns ./config as the cloning user, so
  # homepage-as-1000 can't write config/logs and its dashboard 500s (while
  # /api/healthcheck still reports "up" — the netdata trap). drop_test.sh now
  # reproduces the target's ownership (stages the bind and chowns it to the run
  # uid), and correctness/homepage.sh asserts the DASHBOARD serves 200, so the
  # derivation is faithful. Expected verdict: matches (as its own config owner it
  # needs no caps → minimum [] == the declared cap_drop: ALL).
  - name: homepage
    forgejo_repo: home
    compose_path: docker-compose.yml
    service: homepage
    correctness: testdata/drop-test/correctness/homepage.sh

  # Caddy builds a custom image (`build: .` — xcaddy + the cloudflare DNS plugin,
  # then `COPY --from=builder /usr/bin/caddy`). compose_derive builds it and
  # derives against that ACTUAL image, which matters here: the base caddy:2 binary
  # carries the `cap_net_bind_service=ep` file capability (so dropping the cap
  # makes even exec fail), but Docker's COPY strips file caps, so the deployed
  # binary has none — so it execs fine, and with the container's default
  # `ip_unprivileged_port_start=0` it binds :80/:443 without the cap. Verdict:
  # over_permissioned, drop [NET_BIND_SERVICE] — but this is runtime-posture-bounded:
  # caddy runs as root, so the granted cap still binds :80 under a hardened
  # port_start=1024 (and dropping it fails there). The cap reads removable only
  # because of the loose default sysctl — defense-in-depth, not a clear over-grant
  # (see docs/re-derive-at-deploy.md). Its `${CF_API_TOKEN}` etc. are replaced by a
  # placeholder so the config loads without secrets on the derive host.
  - name: caddy
    forgejo_repo: caddy_reverse_proxy
    compose_path: docker-compose.yml
    service: caddy
    correctness: testdata/drop-test/correctness/caddy_deploy.sh

  # Immich's embedded postgres (a custom pgvector/vectorchord image). The classic
  # startup-cap case: the entrypoint starts as root, chowns + chmods a fresh data
  # dir (CHOWN/FOWNER) and drops to the postgres user via gosu (SETUID/SETGID),
  # reading/writing it as the postgres user thereafter (DAC_OVERRIDE). Its
  # `${DB_DATA_LOCATION}` data-dir bind and `${DB_*}` credentials are absent on the
  # derive host: drop_test gives the data mount a FRESH, foreign-owned dir per trial
  # (reproducing a first-deploy data dir postgres must chown/chmod — the image's own
  # dir is pre-owned by uid 999 and would MASK CHOWN/FOWNER), and the placeholder
  # credentials are read back from the container by the correctness check, which
  # runs the reference workload and asserts a non-root server uid. Derived minimum
  # [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] == the declared cap_add → verdict
  # MATCHES. FOWNER derives NEEDED: the ${VAR} data dir is staged FRESH + foreign-
  # owned per trial (owned by the non-container host user), and postgres's init
  # touches file modes on that foreign-owned tree during setup — so on the faithful
  # cold-start the caps fixidity work reproduces (#337/#338), all five caps are
  # exercised. (An earlier manifest note here predicted over_permissioned drop
  # [FOWNER]; that predated the tmpfs/data-dir fidelity fixes and is stale — the
  # live derivation has been `matches` across runs.) The #340 confidence guard does
  # NOT fire here (FOWNER is in the minimum, so there is no drop to suppress); it
  # would only engage a chown-class cap that derived REMOVABLE against an
  # unguaranteed ${VAR}/named-volume mount — none of the current manifest services
  # hit that, so the guard is a regression tripwire, proven by the hermetic
  # compose_derive_selftest cases, not a live red.
  - name: immich-db
    forgejo_repo: immich
    compose_path: docker-compose.yaml
    service: database
    correctness: testdata/drop-test/correctness/postgres_deploy.sh

  # Immich's redis (valkey) — the other leaf. The entrypoint drops root → the
  # valkey user (uid 999) via `setpriv` (needs SETUID/SETGID) and, on a foreign
  # data dir, would chown it (CHOWN). immich now runs valkey with `read_only: true`
  # + `tmpfs: /data` (#38) and `--requirepass` (#36), so: (a) the correctness check
  # MUST authenticate — an unauth PING returns NOAUTH, which is what made this row
  # derive as derive-error before #332; and (b) CHOWN IS needed — the entrypoint
  # chowns the fresh, root-owned tmpfs /data on boot. Since #337 the drop-test
  # reproduces the tmpfs faithfully (before, /data fell back to the image's pre-owned
  # dir, chown was a no-op, and CHOWN derived falsely-removable — which failed the
  # live deploy, immich #44). Expected verdict now: matches. The correctness check
  # does an auth-aware PING + SET/GET round-trip and asserts a non-root server uid.
  - name: immich-redis
    forgejo_repo: immich
    compose_path: docker-compose.yaml
    service: redis
    correctness: testdata/drop-test/correctness/redis_deploy.sh

# Deferred — documented so each gap is explicit, not silent:
#   The immich app tiers (server, machine-learning, tailscale sidecar) already run
#   cap_drop: ALL with no cap_add — nothing to derive.

# drop-test spec: redis read-only-filesystem tmpfs minimum. redis's only writes
# are to its /data store — a declared VOLUME, so docker auto-mounts a writable
# anonymous volume there even under --read-only (no tmpfs needed; in production
# it is a named volume that must survive restarts, NEVER tmpfs). Under a
# read-only rootfs redis serves the SET/GET + SAVE round-trip with no tmpfs.
# /tmp is drop-tested and comes out NOT required. Minimum: read_only:true,
# tmpfs:[].
#
# Derived under the default docker cap set (so the entrypoint's gosu root->redis
# drop + the fresh-volume chown fire). Correctness reuses redis.sh (SET/GET +
# SAVE + non-root uid assert).
image: docker.io/library/redis
tag: "8.2.7"
dimension: filesystem
base_fs: read_only
fixed: []
candidates: ["/tmp"]
run: {}
correctness: testdata/drop-test/correctness/redis.sh

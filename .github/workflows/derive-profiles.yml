name: derive-profiles
# Re-derivation loop (compose-lint#360 step 4). On a schedule (and on demand),
# re-derive the container-security-profiles catalog against each image's CURRENT
# digest and, when the recommendation is unchanged, open a PR bumping the pinned
# digest + validated_date. A changed recommendation is surfaced for review, never
# auto-applied.
#
# One manifest-driven loop (scripts/derive_profiles.sh) dispatches per entry
# `method`: drop-test entries run scripts/drop_test.sh (docker only); the
# bpf-observation path runs csd under sudo (CAP_BPF/CAP_PERFMON + --pid=host + the
# pinned ig). All current catalog entries are drop-test; the bpf-observation path
# is wired for future runtime-only dimensions.
#
# MUST run on the self-hosted BPF runner (docs/self-hosted-runner.md): the
# observation path needs root + BPF, and drop-test restarts real containers.
# Self-hosted runners bill no Actions minutes.
#
# Setup required before this can run:
#   - a self-hosted runner labelled `csd` (docs/self-hosted-runner.md), with
#     Go + docker + the pinned `ig` + passwordless sudo.
#   - a repo secret CATALOG_PAT: a fine-grained PAT with contents:write +
#     pull-requests:write on tmatens/container-security-profiles ONLY.
# The `csd` runner is an always-on, autostarted VM on the homelab host
# (docs/self-hosted-runner.md), so the weekly schedule runs unattended — it is
# online at cron time. (A prior run cancelled on 2026-07-13 only because the VM's
# autostart was disabled and it was powered off; that is fixed.)
on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays 04:23 UTC (after the catalog staleness check)
  workflow_dispatch:
    inputs:
      force:
        description: "re-derive even when the pinned digest is current"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  derive:
    runs-on: [self-hosted, csd]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: build csd
        run: go build -o csd ./cmd/csd
      - name: checkout catalog
        env:
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CATALOG_PAT}@github.com/tmatens/container-security-profiles.git" \
            catalog
      - name: re-derive
        id: derive
        run: |
          CATALOG="$PWD/catalog" CSD="$PWD/csd" \
            FORCE="${{ inputs.force && '1' || '0' }}" APPLY=1 \
            bash scripts/derive_profiles.sh > derive.log 2>&1 && rc=0 || rc=$?
          cat derive.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: open PR for re-validated profiles / issue for changes
        if: always()
        env:
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
          DERIVE_RC: ${{ steps.derive.outputs.rc }}
          CATALOG_REPO: tmatens/container-security-profiles
        run: |
          set -uo pipefail
          cd catalog
          # git push authenticates via the token embedded in the clone URL; the PR
          # and review-issue calls go over api.github.com (python3 + urllib — no `gh`
          # on the self-hosted runner; matches deploy-check.yml). The token is read
          # from the environment, never a command line, and the log body from a file.
          branch=""
          if git diff --quiet; then
            echo "no profile changes to propose"
          else
            branch="rederive/$(date -u +%Y%m%d-%H%M)"
            git config user.name "csd-derive-bot"
            git config user.email "csd-derive-bot@users.noreply.github.com"
            git switch -C "$branch"
            git commit -aqm "Re-validate profiles against current digests (automated)"
            git push -u origin "$branch"
          fi
          BRANCH="$branch" LOG="${GITHUB_WORKSPACE}/derive.log" python3 - <<'PY'
          import json, os, urllib.request as U, urllib.error
          api="https://api.github.com"
          repo=os.environ["CATALOG_REPO"]; tok=os.environ["CATALOG_PAT"]
          branch=os.environ.get("BRANCH",""); rc=os.environ.get("DERIVE_RC","0")
          logp=os.environ["LOG"]; log=open(logp).read() if os.path.exists(logp) else ""
          H={"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json",
             "User-Agent":"csd-derive-bot"}
          def req(method, path, body=None):
              data=json.dumps(body).encode() if body is not None else None
              try:
                  with U.urlopen(U.Request(api+path, data=data, method=method, headers=H)) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit("GitHub %s %s -> %s: %s" %
                                   (method, path, e.code, e.read().decode()[:400]))
          # A digest bump (working tree changed) -> open a PR bumping validated_image/date.
          if branch:
              pr=req("POST", f"/repos/{repo}/pulls",
                     {"title":"Re-validate catalog profiles against current digests",
                      "head":branch, "base":"main", "body":log})
              print("opened PR", pr.get("html_url"))
          # A CHANGED recommendation (driver rc==12) is a review signal, not a digest
          # bump. An advisory rc (10 — a WARN/MISS coverage gap, e.g. a transient
          # registry pull failure) is log-only: it must never masquerade as CHANGED
          # (that noise opened container-security-profiles#45).
          if rc == "10":
              print("advisory rc=10 (coverage gap, no recommendation change); log-only")
          if rc == "12":
              title="Profile recommendation changed on re-derivation — review"
              issues=req("GET", f"/repos/{repo}/issues?state=open&per_page=100")
              num=next((i["number"] for i in issues
                        if i.get("title")==title and "pull_request" not in i), None)
              if num is not None:
                  req("POST", f"/repos/{repo}/issues/{num}/comments", {"body":log})
                  print("commented on issue", num)
              else:
                  iss=req("POST", f"/repos/{repo}/issues", {"title":title, "body":log})
                  print("opened issue", iss.get("html_url"))
          PY
      # The runner VM's 40G disk accumulates ~2GB/week of superseded image
      # digests, per-trial anonymous volumes, and build cache (it hit 17GB of
      # cruft on 2026-07-16). Prune after every run; the next run re-pulls only
      # what it needs. always(): a failed derive must still clean up.
      - name: prune docker (runner disk hygiene)
        if: always()
        run: |
          docker image prune -af
          docker volume prune -f
          docker builder prune -af

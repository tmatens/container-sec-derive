# drop-test spec: mysql minimum Linux capabilities, default (root-then-drop)
# invocation. Baseline is cap_drop:ALL + the full Docker default cap set on a
# fresh docker-managed datadir (the image declares /var/lib/mysql a VOLUME, so
# each trial gets a fresh anonymous volume).
#
# Near the mariadb startup-cap shape, confirmed from the upstream entrypoint
# (docker-library/mysql 8.4 docker-entrypoint.sh): the entrypoint starts as
# root, `find`-chowns anything in the data dirs not owned by mysql, then
# re-execs itself as the mysql user via `exec gosu mysql` before initializing.
# The image ships /var/lib/mysql (and /var/run/mysqld) owned by mysql uid 999
# mode 1777, so the anonymous volume inherits that ownership: the find-chown is
# a no-op (no CHOWN). Measured minimum: SETGID+SETUID (the gosu drop) PLUS
# DAC_OVERRIDE — the mariadb divergence: mysql's root-phase `find` must also
# traverse /var/lib/mysql-files, which the image ships as mysql-owned mode 750,
# and root WITHOUT DAC_OVERRIDE is subject to normal DAC checks there
# ("find: '/var/lib/mysql-files': Permission denied", container exits). A
# foreign-owned bind mount re-introduces CHOWN — see the catalog criteria doc.
#
# Correctness mirrors the official docker-library test (official-images
# test/tests/mysql-basics): an app-user CREATE/INSERT/SELECT/DROP round-trip,
# plus the non-root uid assert on mysqld (the redis/mariadb sharp edge: the
# server answers queries as root too, so only the uid assert catches a broken
# privilege drop).
image: docker.io/library/mysql
tag: "8.4"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  security_opt: ["no-new-privileges:true"]
  env:
    - MYSQL_ROOT_PASSWORD=csdprobe-pw-12345
    - MYSQL_DATABASE=probe
    - MYSQL_USER=csd
    - MYSQL_PASSWORD=csdprobe-pw-12345
correctness: testdata/drop-test/correctness/mysql.sh

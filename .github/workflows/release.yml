# Release pipeline for container-sec-derive.
#
# Tag-triggered (push: tags: ['v*']). Builds static binaries for
# linux/amd64 + linux/arm64, generates SHA256SUMS, cosign-signs each
# artifact (binaries + the SHA256SUMS file itself), uploads everything to
# a GitHub Release, and (Phase B) builds + signs the GHCR image.
#
# SIGNING IS KEY-BASED, NOT KEYLESS. The project is unpublished pending an
# employer COI decision, and "nothing public" includes the public Rekor
# transparency log. So every cosign call uses --key env://COSIGN_PRIVATE_KEY
# with --tlog-upload=false and writes NO public log entry. Requires repo
# secrets COSIGN_PRIVATE_KEY + COSIGN_PASSWORD and a committed cosign.pub
# (`cosign generate-key-pair`). When the project goes public, switching to
# keyless (OIDC + Rekor) is a deliberate, reviewable change.
#
# Per PLAN.md §Supply-chain: "Unsigned artifacts are not released." Step 36
# added SBOM generation (SPDX + CycloneDX via anchore/sbom-action).
#
# All third-party actions are SHA-pinned per CLAUDE.md §Dependency pinning.
# Reusing actions/checkout + actions/setup-go pins from ci.yml so the
# workflows advance in lockstep.
#
# Verify a binary (also in README.md):
#   cosign verify-blob --key cosign.pub --insecure-ignore-tlog \
#     --signature csd_linux_amd64.sig csd_linux_amd64
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # upload to GitHub release

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        # -trimpath strips local file paths from the binary;
        # -ldflags "-s -w" strips symbol/debug tables; -X main.version
        # stamps the release version (tag without the leading v) so
        # `csd --version` reports e.g. "csd 0.1.0" instead of the "dev"
        # default. The container image injects the same value (Dockerfile
        # / release.yml Phase B), so binary and image report identically.
        # Reproducibility status is documented in docs/wsl2.md — we are
        # pinned + trimmed, not yet bit-for-bit.
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "csd_linux_${GOARCH}" .
      # Smoke the stamped version on the native arch only — the arm64
      # binary is cross-compiled and cannot exec on the amd64 runner.
      # Catches a regression where the -X injection falls off and a real
      # tag ships binaries self-reporting "dev".
      - name: verify stamped version (amd64)
        if: matrix.arch == 'amd64'
        run: |
          expected="csd ${GITHUB_REF_NAME#v}"
          actual="$(./csd_linux_amd64 --version)"
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          [ "${actual}" = "${expected}" ] || { echo "::error::binary version '${actual}' != tag '${expected}'"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csd-linux-${{ matrix.arch }}
          path: csd_linux_${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: sign + publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: layout
        run: |
          ls -la dist/
          # The matrix uploads name the file directly; flatten
          # confirms both expected binaries are present before signing.
          test -f dist/csd_linux_amd64
          test -f dist/csd_linux_arm64
          chmod +x dist/csd_linux_amd64 dist/csd_linux_arm64
      # SBOMs are generated against the source tree (which includes
      # go.mod / go.sum) before SHA256SUMS so the manifest captures
      # their digests. Two formats per PLAN.md §Supply-chain: SPDX
      # JSON (the cross-tool lingua franca) and CycloneDX JSON (richer
      # metadata, common in container scanners). syft auto-detects Go
      # modules; csd has zero non-stdlib runtime deps so the SBOM is
      # small but still records the Go toolchain version. Vendored ig
      # provenance is NOT yet recorded in these SBOMs — that lands
      # with the ig vendoring + container image step (follow-up).
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: csd.spdx.json
          output-file: dist/csd.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: csd.cyclonedx.json
          output-file: dist/csd.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SHA256SUMS
        working-directory: dist
        # Sorted to keep the manifest stable across runs. SBOM digests
        # are included so a verifier with only the manifest in hand
        # can confirm the SBOMs alongside the binaries. Vendored ig
        # digest lands here when ig bundling ships.
        run: |
          sha256sum csd_linux_amd64 csd_linux_arm64 csd.spdx.json csd.cyclonedx.json | sort > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign 2.x: 3.x removed --tlog-upload=false / --output-signature
          # (requires a --signing-config instead). Staying on 2.x preserves the
          # no-public-Rekor COI guarantee; Renovate keeps it patched within 2.x.
          cosign-release: v2.6.3
      - name: cosign sign-blob (key-based, no transparency log)
        working-directory: dist
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        # Key-based + --tlog-upload=false writes NO public Rekor entry
        # (the project is unpublished pending COI; nothing public). Each
        # artifact gets a detached <file>.sig, verified offline with:
        #   cosign verify-blob --key cosign.pub --insecure-ignore-tlog \
        #     --signature f.sig f
        # (--insecure-ignore-tlog just asserts "no transparency-log entry
        # is expected", which is correct for this no-tlog setup.)
        run: |
          for f in csd_linux_amd64 csd_linux_arm64 csd.spdx.json csd.cyclonedx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --key env://COSIGN_PRIVATE_KEY \
              --tlog-upload=false \
              --output-signature "${f}.sig" \
              "${f}"
          done
          ls -la
      # Release notes are the CHANGELOG section for this tag, so the GitHub
      # Release body matches the documented changes instead of publishing empty.
      # The version is the tag without the leading v (the CHANGELOG header form,
      # e.g. ## [0.4.0]); awk captures from that header to the next ## [ section.
      # A fallback keeps the release from ever publishing an empty body if the
      # section is missing (e.g. a tag cut ahead of its changelog entry).
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Trim leading/trailing blank lines for a tidy release body.
          awk 'NF { p = 1 } p' RELEASE_NOTES.md | tac | awk 'NF { p = 1 } p' | tac > RELEASE_NOTES.trimmed
          mv RELEASE_NOTES.trimmed RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for the changes in this release.\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
          echo "--- release notes ---"
          cat RELEASE_NOTES.md
      - name: publish release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/csd_linux_amd64
            dist/csd_linux_arm64
            dist/csd.spdx.json
            dist/csd.cyclonedx.json
            dist/SHA256SUMS
            dist/csd_linux_amd64.sig
            dist/csd_linux_arm64.sig
            dist/csd.spdx.json.sig
            dist/csd.cyclonedx.json.sig
            dist/SHA256SUMS.sig

  # === Step 38 Phase B — GHCR image publish (PRIVATE) ====================
  #
  # Publishes ghcr.io/tmatens/container-sec-derive to GitHub Container
  # Registry: per-arch build pushed BY DIGEST on native runners, a tagged
  # manifest list, then cosign KEY-BASED (no-tlog) sign + attest (SBOM +
  # OpenVEX). Auth is the ephemeral GITHUB_TOKEN — no Docker Hub secret.
  #
  # COI posture: per the maintainer's rule, PRIVATE publishing is fine —
  # only PUBLIC exposure is gated. GHCR packages are PRIVATE by default, so
  # these jobs publish a private, collaborator-only image and write NO
  # public Rekor entry (key-based, --tlog-upload=false). THE ONLY PUBLIC /
  # COI-GATED ACT is flipping the GHCR package visibility to public — a
  # manual step done only after the COI decision. Keep the package private
  # until then. (No in-workflow approval gate is needed because the push
  # itself exposes nothing publicly.)
  #
  # Action SHAs reuse this repo's existing pins; the two GHCR-only actions
  # (login / metadata) reuse compose-lint's vetted SHAs for family lockstep.
  image-build:
    name: image build+push by digest (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to GHCR via GITHUB_TOKEN
    steps:
      - name: Derive slug from platform
        id: slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Resolve build args
        id: vars
        run: |
          ig_version="$(awk -F'"' '/^[[:space:]]+PinnedIGVersion[[:space:]]+=/ {print $2; exit}' main.go)"
          [ -n "${ig_version}" ] || { echo "::error::could not extract PinnedIGVersion from main.go"; exit 1; }
          echo "ig_version=${ig_version}" >> "$GITHUB_OUTPUT"
          # csd --version prints "csd <version>"; strip the leading v to
          # match the tag-without-v convention the verify step asserts.
          echo "csd_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            IG_VERSION=${{ steps.vars.outputs.ig_version }}
            CSD_VERSION=${{ steps.vars.outputs.csd_version }}
            TARGETARCH=${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/tmatens/container-sec-derive,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into a tagged manifest list, then cosign
  # KEY-BASED (no-tlog) sign the manifest and attach SBOM + OpenVEX.
  image-publish:
    name: image manifest + sign + attest
    needs: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push manifest list to GHCR
    steps:
      # Checkout provides cosign.pub (for verify) and
      # .vex/container-sec-derive.openvex.json (for the OpenVEX attest).
      # Digests land in /tmp/digests (outside the workspace) so checkout
      # and download-artifact do not collide.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign 2.x — see the sign-blob job above. 3.x breaks the
          # --tlog-upload=false no-public-Rekor flow used by all sign/attest steps.
          cosign-release: v2.6.3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/tmatens/container-sec-derive
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_flags=()
          while IFS= read -r t; do tag_flags+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_refs=()
          for f in *; do digest_refs+=("ghcr.io/tmatens/container-sec-derive@sha256:${f}"); done
          docker buildx imagetools create "${tag_flags[@]}" "${digest_refs[@]}"
      - name: Inspect manifest digest
        id: inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/tmatens/container-sec-derive:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign manifest (key-based, no transparency log)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "ghcr.io/tmatens/container-sec-derive@${DIGEST}"
      - name: Verify — cosign signature (offline, against cosign.pub)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: cosign verify --key cosign.pub --insecure-ignore-tlog=true "ghcr.io/tmatens/container-sec-derive@${DIGEST}"
      - name: Verify — published version matches tag
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          expected="csd ${GITHUB_REF_NAME#v}"
          actual="$(docker run --rm "ghcr.io/tmatens/container-sec-derive@${DIGEST}" --version)"
          echo "expected: ${expected}"; echo "actual:   ${actual}"
          [ "${actual}" = "${expected}" ] || { echo "::error::published image version '${actual}' != tag '${expected}'"; exit 1; }
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/tmatens/container-sec-derive@${{ steps.inspect.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          # This SBOM is consumed by the attest step below (attached to the image
          # manifest), not the GitHub release. Both default to true; release-asset
          # upload needs contents:write, which this job intentionally lacks
          # (contents:read + packages:write only). Matches the binary SBOM steps.
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM to image (key-based, no tlog)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --type spdxjson --predicate image.spdx.json "ghcr.io/tmatens/container-sec-derive@${DIGEST}"
      - name: Attest OpenVEX to image (key-based, no tlog)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --type openvex --predicate .vex/container-sec-derive.openvex.json "ghcr.io/tmatens/container-sec-derive@${DIGEST}"
      # Vendored `ig` provenance: IG version + upstream per-arch tarball digests
      # + the cosign-verified pin, emitted deterministically from ig-pin/ (no
      # network). syft's image SBOM catalogs ig as a Go binary but not its
      # upstream artifact digests or that the pin is cosign-verified; this
      # records that explicitly. Predicate is gated at PR time by
      # TestIGProvenancePredicate; only this attest call needs a release run.
      - name: Generate ig provenance predicate
        run: ./scripts/gen-ig-provenance.sh > ig-provenance.json
      - name: Attest ig provenance to image (key-based, no tlog)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --type https://github.com/tmatens/container-sec-derive/attestations/ig-provenance/v1 \
            --predicate ig-provenance.json \
            "ghcr.io/tmatens/container-sec-derive@${DIGEST}"

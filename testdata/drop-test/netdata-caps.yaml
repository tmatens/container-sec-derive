# drop-test spec: netdata cap_add minimum, run as a host monitor.
image: docker.io/netdata/netdata
tag: v2.10.3
dimension: capabilities
health_port: 19999   # network: host → the harness refuses to run if :19999 is already held (foreign instance would pollute the drop-test)
# Everything granted is a candidate — including SYS_PTRACE, which the drop-test
# DOES detect once the correctness check reads the right signal. apps.plugin runs
# real-uid = the netdata user (setuid gives it euid 0, not real uid 0), so reading
# ANY process's /proc/<pid>/io|fd needs CAP_SYS_PTRACE. Without it apps.plugin
# doesn't error out — it collects EVERY per-process metric as ZERO. So the
# correctness check must require a per-process fds_open to be NON-ZERO (not merely
# non-null): dropping SYS_PTRACE zeros it and the check fails. SYS_ADMIN also stays
# a candidate and derives removable (no ebpf.plugin; ebpf=yes is a no-op).
fixed: []
candidates: ["SYS_PTRACE", "SYS_ADMIN", "DAC_OVERRIDE", "CHOWN", "FOWNER", "SETUID", "SETGID"]
run:
  pid: host
  network: host
  security_opt: ["apparmor=unconfined"]
  env: ["PGID=__DOCKER_GID__"]
  mounts:
    - "/proc:/host/proc:ro"
    - "/sys:/host/sys:ro"
    - "/etc/os-release:/host/etc/os-release:ro"
    - "/var/log:/host/var/log:ro"
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    - "/etc/passwd:/host/etc/passwd:ro"
    - "/etc/group:/host/etc/group:ro"
correctness: testdata/drop-test/correctness/netdata.sh
# The feature ledger (#206 slice 3b): which privilege-relevant features this
# spec's correctness check does and does not drive. Generated from the grants
# netdata requests (SYS_PTRACE, SYS_ADMIN, the docker.sock mount), not from an
# open-ended feature enumeration.
features:
  - name: "host + per-process monitoring (apps.plugin /proc io/fd metrics)"
    driven: true
    why: "the correctness check requires a per-process fds_open chart to be NON-ZERO (dropping SYS_PTRACE zeroes it)"
  - name: "per-container network-interface metrics (cgroup-network)"
    driven: true
    why: "verified on the live deploy: collects via the host-side veth fallback under the derived set (SYS_ADMIN's setns path fails once, non-fatally)"
  - name: "eBPF collectors (ebpf.plugin)"
    driven: false
    why: "the image ships no ebpf.plugin, so nothing gates on it (ebpf=yes is a no-op); a custom build with the plugin would need re-derivation"
  - name: "docker.sock-based collectors (container names/state)"
    driven: false
    why: "socket access is a group grant, not a capability, so it cannot move this dimension; per-process docker metrics come via /proc + SYS_PTRACE"
  - name: "remaining optional collector surface"
    driven: false
    why: "not exhaustively driven — the reason this dimension's coverage grades partial (ADR-018); no known collector requires a cap outside the derived set"

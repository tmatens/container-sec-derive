# drop-test no-mount ROOTFS fidelity lock (csd#340 item 6): a service with NO
# external volume that mkdir+chowns a path on its own rootfs on boot (a common init
# pattern). The rootfs is fresh on every drop-test trial (a new container), so this
# case is inherently faithful — but nothing proved it, and the #337 confidence
# guard must not treat "no mounts" as "nothing to exercise". The synthetic
# entrypoint (rootfs-chown op) mkdir's /var/lib/csd-app and chowns it to uid 999
# (a real owner change), so CAP_CHOWN derives NEEDED. The paired
# rootfs-nomount-noop-caps.yaml sets CSD_ROOTFS_CHOWN_UID=0 (no ownership change)
# and derives CHOWN removable. No mounts, no seed — the pure no-mount rootfs path.
# Built locally by scripts/smoke_drop_rootfs.sh.
image: csd-seed-fidelity
tag: "0.1"
no_pull: true
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  env: ["CSD_SEED_OP=rootfs-chown"]
correctness: testdata/drop-test/correctness/seed-fidelity.sh

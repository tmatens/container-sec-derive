# Loose-posture control for csd#340 item 5 (see netbind-hardened-caps.yaml): the
# SAME low-port bind, but net.ipv4.ip_unprivileged_port_start is pinned to 0 (the
# docker default) — so :80 is an unprivileged port, the bind needs no capability,
# and the drop-test derives NET_BIND_SERVICE REMOVABLE. Only the sysctl differs
# from the hardened spec (0 here vs 1024 there), proving the derived cap tracks the
# kernel posture and that a bare derivation on docker's default silently reads the
# cap as droppable. The smoke asserts NET_BIND_SERVICE is PRESENT under 1024 and
# ABSENT here.
image: csd-seed-fidelity
tag: "0.1"
no_pull: true
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  env: ["CSD_SEED_OP=bindlow"]
  sysctls: ["net.ipv4.ip_unprivileged_port_start=0"]   # docker default (loose)
correctness: testdata/drop-test/correctness/seed-fidelity.sh

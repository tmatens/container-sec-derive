# drop-test spec: forgejo minimum Linux capabilities, default s6-init invocation.
# Baseline is cap_drop:ALL + the full Docker default cap set on a FRESH /data volume
# (the image declares /data as a VOLUME, so each trial gets a fresh, root-owned
# anonymous volume — reproducing a first deploy, so the root->git chown fires).
#
# The forgejo image runs TWO root daemons under s6: `gitea web` (chowns /data to the
# git user, then drops root->git via su-exec) and `sshd` (stays root, but OpenSSH
# forks a pre-auth privilege-separation child that chroots + setuids per connection).
# The minimum is the UNION across both, so the correctness check exercises both — a
# web-only check reports 200 while git-over-SSH is silently dead without SYS_CHROOT
# (workload coverage bounds validity; see docs/re-derive-at-deploy.md).
#
# Startup caps (CHOWN for the fresh-volume chown, SETUID/SETGID for the su-exec drop
# and sshd privsep) are invisible to attach-window runtime observation — the
# drop-test is the authoritative signal, same lesson as postgres/netdata.
#
# Derived on a writable rootfs (the deployment sets no read_only), so no sibling
# filesystem dimension is applied; an fs profile for forgejo is future work.
image: codeberg.org/forgejo/forgejo
tag: "15"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  env:
    - USER_UID=1000
    - USER_GID=1000
    - FORGEJO__database__DB_TYPE=sqlite3
    - FORGEJO__database__PATH=/data/gitea/gitea.db
    - FORGEJO__security__INSTALL_LOCK=true
    - FORGEJO__server__ROOT_URL=http://localhost:3000/
correctness: testdata/drop-test/correctness/forgejo_deploy.sh

# drop-test spec: pihole minimum Linux capabilities, DNS-only scope (the
# queue's explicit boundary: DHCP mode needs NET_ADMIN and is OUT of scope).
# Baseline is cap_drop:ALL + the full Docker default cap set. The image
# declares NO volumes, so every trial is a faithful fresh-rootfs cold start.
#
# Shape: the container starts as root (entrypoint provisions /etc/pihole),
# pihole-FTL binds :53 — a PRIVILEGED port, so NET_BIND_SERVICE under the
# pinned ip_unprivileged_port_start=1024 posture — and drops to the pihole
# user (uid 1000). Upstream docs suggest a much broader set (NET_RAW,
# NET_ADMIN, SYS_NICE...); the queue predicted a strong over-grant finding —
# the drop-test decides what is actually load-bearing on the DNS serve path.
#
# NO no-new-privileges — measured incompatibility, part of the profile's
# story: the entrypoint SETCAPs the FTL binary (file capabilities) so the
# non-root FTL can bind :53, and nnp blocks file-cap acquisition on exec.
# Under the pinned privileged-port posture, pihole + nnp can never listen on
# 53. Expect SETFCAP itself to derive required (the setcap call), a rare cap.
#
# Correctness = REAL DNS resolution with no external dependence: dig the
# `pi.hole` name, which FTL answers authoritatively itself — deterministic
# per trial, no upstream reachability in the loop. Probes exec as
# --user pihole (probe-caps hygiene) using the in-image dig; plus the
# non-root uid assert on FTL.
image: docker.io/pihole/pihole
tag: "2026.07.2"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  env: ["FTLCONF_webserver_api_password=csdprobe-pw-12345"]
  sysctls: ["net.ipv4.ip_unprivileged_port_start=1024"]
correctness: testdata/drop-test/correctness/pihole.sh

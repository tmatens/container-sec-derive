# Docker Scout (scheduled) — continuous CVE scan of the published image.
#
# Mirrors compose-lint's scout-scan.yml: scan the published GHCR image
# for CVEs and apply the same OpenVEX document the release pipeline
# attaches as an attestation, so a vuln we've assessed as not_affected
# does not spuriously fail the scan. High-severity stays warning-only.
#
# HELD WITH PHASE B: this scans ghcr.io/tmatens/container-sec-derive:latest,
# which does not exist until the COI-gated image publish runs (and the
# GHCR package starts private). Until then the schedule is intentionally
# OFF (workflow_dispatch only) so it does not fail daily against a
# missing/private image. Uncomment the `schedule:` block once the first
# image has published.
#
# Auth is the ephemeral GITHUB_TOKEN (packages: read) — no Docker Hub
# secret. Action SHAs reuse release.yml / compose-lint's vetted pins.
name: Docker Scout (scheduled)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * *"   # enable once the image is published (Phase B)

permissions:
  contents: read
  packages: read   # pull the GHCR image via GITHUB_TOKEN

jobs:
  scout:
    name: scout cves
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Check out so .vex/container-sec-derive.openvex.json is on disk
      # for the vex-location input below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scout — CVEs (VEX-filtered)
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: cves
          image: ghcr.io/tmatens/container-sec-derive:latest
          # Apply the same OpenVEX document the published image carries as
          # an attestation, so an assessed not_affected CVE is suppressed.
          vex-location: .vex/container-sec-derive.openvex.json
          # Scout's default vex-author allowlist is `<.*@docker.com>`;
          # widen it so our own maintainer-authored VEX is honored.
          vex-author: .*
          # Warning-only: surface CVEs without failing the run (this is a
          # monitoring scan, not a release gate).
          exit-code: false
          only-severities: critical,high

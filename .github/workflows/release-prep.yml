# Release-prep automation (ROADMAP §Maturity; docs/RELEASING.md).
#
# workflow_dispatch with a target version → runs scripts/release-prep.sh (the
# deterministic CHANGELOG rename + ToolVersion bump + README refresh + golden
# regen + in-test assertion bump, gated by build/vet/test) and opens a
# "Prepare X.Y.Z release" PR. The human gate stays at: review + merge the PR,
# then sign + push the vX.Y.Z tag (which fires release.yml). This never tags,
# pushes to main, or touches SchemaVersion.
#
# NOTE: the PR is opened with GITHUB_TOKEN, so `pull_request` workflows do not
# auto-run on it (GitHub's recursion guard). The prep job's own build+vet+test
# IS the correctness gate; if you want the full PR check suite too, push an
# empty commit or close/reopen the PR. (csd has no PAT secret by design.)
#
# Third-party actions SHA-pinned per CLAUDE.md §Dependency pinning, in lockstep
# with ci.yml / integration.yml / release.yml.
name: release-prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version X.Y.Z (no leading v)"
        required: true

permissions:
  contents: write       # create + push the release/vX.Y.Z branch
  pull-requests: write  # open the prepare-release PR

concurrency:
  group: release-prep-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare ${{ github.event.inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials (default true) is required so the later git push
        # authenticates with GITHUB_TOKEN.

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release-prep (mutate + gate)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (got '${VERSION}')"
            exit 1
          fi
          scripts/release-prep.sh "${VERSION}"

      - name: Open prepare-release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -A
          git commit -m "Prepare ${VERSION} release

          Automated by .github/workflows/release-prep.yml (scripts/release-prep.sh):
          CHANGELOG [Unreleased] -> [${VERSION}], ToolVersion bump, README version
          strings, regenerated sidecar goldens, in-test version assertions.
          SchemaVersion untouched. Review, merge, then sign + push the v${VERSION}
          tag to fire release.yml."
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "Prepare ${VERSION} release" \
            --body "Automated release-prep for **${VERSION}** (\`scripts/release-prep.sh\` via \`release-prep.yml\`).

          Deterministic bumps only: CHANGELOG \`[Unreleased]\` → \`[${VERSION}]\`, \`ToolVersion\`, README version strings, regenerated sidecar goldens (tool_version), and the in-test version assertions. **SchemaVersion is intentionally untouched** (schema bumps belong to the feature PR that changed the schema).

          The prep job's \`go vet\` / \`go build\` / \`go test ./...\` is the correctness gate. Because this PR was opened by GITHUB_TOKEN, the \`pull_request\` check suite does not auto-run — push an empty commit or close/reopen if you want it.

          **Next (human gate):** review + merge, then \`git tag -s v${VERSION} && git push origin v${VERSION}\` to fire \`release.yml\`. See docs/RELEASING.md."
          echo "Opened prepare-release PR for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

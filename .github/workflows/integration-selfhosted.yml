# Extra live-BPF coverage that GitHub-HOSTED runners can't give: a SECOND real
# kernel (beyond the hosted ubuntu-24.04 one), REAL hardware devices, and the
# closed-loop "meets intent" run on the user's own host.
#
# TRUST MODEL (issue #116, decision: Option A). This job runs root + BPF on a
# self-hosted runner, so it must NEVER execute untrusted PR code privileged.
# Therefore it triggers ONLY on workflow_dispatch + schedule, which run against
# the DEFAULT BRANCH (main) — i.e. trusted, already-reviewed-and-merged code.
# There is deliberately NO `pull_request` trigger, which also means this creates
# NO perpetually-pending PR checks while no runner is registered.
#
# Recommended runner posture: an EPHEMERAL self-hosted runner (fresh per job),
# labelled `[self-hosted, csd]`, brought up on demand (desktop or a VM/LXC on the
# homelab host), the suite triggered, then torn down — no always-on box needed.
# Registration + host prerequisites: docs/self-hosted-runner.md.
name: integration-selfhosted

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Per-observer observation window (Go duration, e.g. 30s)"
        required: false
        default: "30s"
  schedule:
    # Weekly (Mon 06:00 UTC). schedule runs on the default branch only.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  selfhosted:
    name: self-hosted live-bpf + hardware
    runs-on: [self-hosted, csd]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build csd
        run: go build -o csd ./cmd/csd

      # Self-heal the pinned ig (issue #322). A self-hosted runner that lost its
      # ig to a reboot or a /usr/local/bin wipe used to fail every smoke with
      # IGMissing(31); re-provisioning it here — idempotently, verified against
      # ig-pin/SHA256SUMS, the same script the hosted lane uses — means the lane
      # recovers on the next run instead of staying degraded for weeks. Passwordless
      # sudo (already required for the BPF smokes) writes /usr/local/bin.
      - name: Ensure pinned ig (self-heal, verified against ig-pin/SHA256SUMS)
        run: scripts/install_pinned_ig.sh

      # The whole point of a second runner: record ITS kernel (different from the
      # hosted ubuntu-24.04 one). The ig assertion is a HARD gate so a missing or
      # wrong ig top-lines the report as one clear line here, not six identical
      # downstream IGMissing failures (issue #322). Docker + passwordless sudo for
      # BPF remain the runner owner's responsibility — see docs/self-hosted-runner.md.
      - name: Preflight (assert pinned ig; record this host's kernel / docker)
        run: |
          ig_pin="$(awk -F'"' '/^[[:space:]]+PinnedIGVersion[[:space:]]+=/ {print $2; exit}' internal/ig/ig.go)"
          ig_have="$(ig version 2>/dev/null | awk 'NR==1{print $1}' || true)"
          {
            echo "self-hosted preflight: kernel=$(uname -r)"
            if [ -e /sys/kernel/btf/vmlinux ]; then echo "self-hosted preflight: BTF=present"; else echo "self-hosted preflight: BTF=ABSENT"; fi
            echo "self-hosted preflight: ig=${ig_have:-MISSING} (pin ${ig_pin})"
            echo "self-hosted preflight: docker=$(docker version --format '{{.Server.Version}}' 2>&1 | head -1)"
            # Image store: overlay2 -> legacy graphdriver; overlayfs + a DriverStatus of
            # io.containerd.snapshotter.v1 -> containerd image store (Docker 29 default).
            # See issue #180 -- `docker history` differs under the containerd store.
            echo "self-hosted preflight: docker-store=$(docker info --format '{{.Driver}} {{.DriverStatus}}' 2>&1 | head -1)"
          } | tee preflight_sh.txt
          if [ "${ig_have}" != "${ig_pin}" ]; then
            echo "::error::pinned ig ${ig_pin} missing/mismatched on runner (found '${ig_have:-none}') — smokes would fail IGMissing(31); see docs/self-hosted-runner.md"
            exit 1
          fi

      # The hardware-free smoke suite, now on a DIFFERENT real kernel. Reuses the
      # same gates the hosted integration job runs; capture each exit code so a
      # FAIL fails the job.
      - name: Smoke suite on this host's kernel
        env:
          DURATION: ${{ github.event.inputs.duration || '30s' }}
        run: |
          rc=0
          for s in smoke_wsl2 smoke_fs smoke_device smoke_capadd smoke_egress smoke_adversarial_dac smoke_adversarial_perf closed_loop; do
            echo "===== ${s} ====="
            sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" "scripts/${s}.sh" || { echo "FAIL ${s} (exit $?)"; rc=1; }
          done
          exit $rc

      # Drop-test staging-fidelity smoke (csd#340 item 2). NOT a BPF test — the
      # drop-test uses no eBPF, only docker + python + jq — so it runs un-sudo'd as
      # the runner user (the same context derive-profiles.yml runs drop_test in). It
      # proves a cap exercised only against pre-existing foreign-owned content
      # (DAC_OVERRIDE) derives NEEDED when seed_mounts stages that content and
      # REMOVABLE on a fresh mount — the #337-inverse fidelity guard.
      - name: Drop-test staging-fidelity smoke (csd#340)
        run: |
          rc=0
          PY=python3 scripts/smoke_drop_seed.sh > smoke_drop_seed.txt 2>&1 || { echo "FAIL smoke_drop_seed"; rc=1; }
          cat smoke_drop_seed.txt
          PY=python3 scripts/smoke_drop_mode.sh > smoke_drop_mode.txt 2>&1 || { echo "FAIL smoke_drop_mode"; rc=1; }
          cat smoke_drop_mode.txt
          PY=python3 scripts/smoke_drop_namedvol.sh > smoke_drop_namedvol.txt 2>&1 || { echo "FAIL smoke_drop_namedvol"; rc=1; }
          cat smoke_drop_namedvol.txt
          PY=python3 scripts/smoke_drop_rootfs.sh > smoke_drop_rootfs.txt 2>&1 || { echo "FAIL smoke_drop_rootfs"; rc=1; }
          cat smoke_drop_rootfs.txt
          PY=python3 scripts/smoke_drop_netbind.sh > smoke_drop_netbind.txt 2>&1 || { echo "FAIL smoke_drop_netbind"; rc=1; }
          cat smoke_drop_netbind.txt
          exit $rc

      # Live end-to-end smoke for the `csd deploy-check` subcommand (#355). Drives
      # the REAL binary through the compose->spec->derive->diff pipeline against a
      # synthetic compose (deterministic [CHOWN] minimum), asserting both the
      # pipeline verdict and the wrapper exit-code policy. The hermetic
      # internal/deploycheck tests stub the child script; this is the live half.
      # Not a BPF test (docker + python + jq only) but needs the built csd, so it
      # runs as the runner user with CSD pointed at the build above.
      - name: deploy-check subcommand live smoke (#355)
        run: |
          CSD="$PWD/csd" PY=python3 scripts/smoke_deploy_check.sh > smoke_deploy_check.txt 2>&1 && rc=0 || rc=$?
          cat smoke_deploy_check.txt
          exit "$rc"

      # The real-hardware device test — only this self-hosted job can run it
      # (hosted runners have no GPU/tun/kvm to pass through). Host-adaptive: tests
      # whatever real /dev nodes are present, skips the rest.
      - name: Hardware-ful device smoke
        env:
          DURATION: ${{ github.event.inputs.duration || '30s' }}
        run: |
          sudo env "CSD=$PWD/csd" "DURATION=${DURATION}" scripts/smoke_device_hw.sh > smoke_device_hw.txt 2>&1 && rc=0 || rc=$?
          cat smoke_device_hw.txt
          exit $rc

      # No PR to comment on (dispatch/schedule only) — surface the verdict in the
      # job summary. Allowlisted PASS/FAIL/INFO + the recorded kernel, no env dump.
      - name: Job summary (allowlisted, no secrets)
        if: always()
        run: |
          {
            echo "### Self-hosted live-BPF + hardware report";
            echo '```';
            cat preflight_sh.txt 2>/dev/null || true;
            echo '-- drop-test staging fidelity (csd#340) --';
            grep -hE '^(PASS|FAIL|smoke-drop-seed:)' smoke_drop_seed.txt 2>/dev/null || true;
            grep -hE '^(PASS|FAIL|smoke-drop-mode:)' smoke_drop_mode.txt 2>/dev/null || true;
            grep -hE '^(PASS|FAIL|smoke-drop-namedvol:)' smoke_drop_namedvol.txt 2>/dev/null || true;
            grep -hE '^(PASS|FAIL|smoke-drop-rootfs:)' smoke_drop_rootfs.txt 2>/dev/null || true;
            grep -hE '^(PASS|FAIL|smoke-drop-netbind:)' smoke_drop_netbind.txt 2>/dev/null || true;
            echo '-- deploy-check subcommand (#355) --';
            grep -hE '^(PASS|FAIL|smoke-deploy-check:)' smoke_deploy_check.txt 2>/dev/null || true;
            echo '-- hardware-ful devices --';
            grep -hE '^(PASS|FAIL|INFO|smoke-device-hw:)' smoke_device_hw.txt 2>/dev/null || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

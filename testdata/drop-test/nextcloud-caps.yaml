# drop-test spec: nextcloud minimum Linux capabilities, default in-stack
# invocation (MYSQL_* env against a mariadb database, apache variant, admin
# auto-install via NEXTCLOUD_ADMIN_*). Baseline is cap_drop:ALL + the full
# Docker default cap set.
#
# In-stack lifecycle (measured, encoded in the correctness check): the `db`
# dep persists across trials, but nextcloud CANNOT adopt an installed DB from
# a fresh docroot volume — it boots into a running-but-broken "installed:
# false" limbo. The correctness check detects that limbo, resets the database
# (root exec in the dep) and docker-restarts the target, whose entrypoint then
# performs a clean install UNDER THE TRIAL'S CAP POSTURE. Each trial's first
# boot also rsyncs ~700MB of sources into its fresh volume under the trial
# posture, so both the copy phase and the install phase are exercised.
#
# Expected shape: the wordpress family (root-phase source copy + config
# writes + apache www-data worker drop) minus the low-port bind... except
# nextcloud's apache also binds :80 — so NET_BIND_SERVICE under the pinned
# sysctl posture as well. The drop-test decides.
image: docker.io/library/nextcloud
tag: "32"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
deps:
  - name: db
    image: docker.io/library/mariadb
    tag: "11.4"
    env: [MARIADB_ROOT_PASSWORD=csdprobe-root-pw-12345, MARIADB_DATABASE=nextcloud,
          MARIADB_USER=nextcloud, MARIADB_PASSWORD=csdprobe-pw-12345]
    ready: MYSQL_PWD=$MARIADB_PASSWORD mariadb -u$MARIADB_USER $MARIADB_DATABASE -e "SELECT 1"
run:
  env: [MYSQL_HOST=db, MYSQL_DATABASE=nextcloud, MYSQL_USER=nextcloud,
        MYSQL_PASSWORD=csdprobe-pw-12345, NEXTCLOUD_ADMIN_USER=csdadmin,
        NEXTCLOUD_ADMIN_PASSWORD=CsdProbe-Pw-12345, NEXTCLOUD_TRUSTED_DOMAINS=localhost]
  security_opt: ["no-new-privileges:true"]
  sysctls: ["net.ipv4.ip_unprivileged_port_start=1024"]
correctness: testdata/drop-test/correctness/nextcloud.sh

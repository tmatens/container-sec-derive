# drop-test spec: memcached read-only-filesystem tmpfs minimum. memcached is an
# in-memory store — it writes nothing to disk. Under --read-only it serves the
# set/get round-trip with no tmpfs at all. /tmp is drop-tested and comes out NOT
# required. Minimum: read_only:true, tmpfs:[].
#
# Derived under the default docker cap set (orthogonal to the zero-cap minimum).
# Correctness reuses memcached.sh (a real set/get round-trip + the non-root uid
# assert).
image: docker.io/library/memcached
tag: "1.6"
dimension: filesystem
base_fs: read_only
fixed: []
candidates: ["/tmp"]
run: {}
correctness: testdata/drop-test/correctness/memcached.sh

# drop-test spec: Home Assistant minimum Linux capabilities, default invocation.
# Baseline is cap_drop:ALL + the full Docker default cap set (the deployment sets no
# cap_drop — the compose comment: "tighten further only after verifying HA still
# boots"). HA runs `python3 -m homeassistant` under s6 AS ROOT: no privilege drop
# and no chown in init, so there is no SETUID/SETGID/CHOWN startup step.
#
# The one cap HA CORE exercises comes from WHERE it writes. The `/config` mount is a
# ${VAR} source, so drop_test gives each trial a FRESH, non-root-owned dir — faithful
# to the real deployment, where `./config` is owned by the deploy user (uid 1000) and
# HA runs as root. Root writing its DB / .storage / logs into that non-root-owned dir
# needs DAC_OVERRIDE; the correctness check exercises that write path (reach the
# onboarding API + create the owner user), not mere liveness.
#
# SCOPE: this derives HA *core* on a base config. Capabilities that specific
# integrations pull in — NET_RAW (ICMP ping), device access (USB/Bluetooth/Zigbee),
# NET_ADMIN (some network integrations) — are NOT exercised by a base instance and
# are documented as extensions in the criteria doc. The faithful per-deployment
# re-derivation (against the real ./config) is a deploy-check follow-up.
image: ghcr.io/home-assistant/home-assistant
tag: stable
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  mounts:
    - "${HA_CONFIG}:/config"
  env:
    - TZ=America/Chicago
correctness: testdata/drop-test/correctness/home_assistant.sh

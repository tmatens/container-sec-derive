# CodeQL static analysis for container-sec-derive (Go + GitHub Actions).
#
# ARTIFACT MODE — private-repo posture. csd is a private repo without GitHub
# Advanced Security, so code scanning is disabled and SARIF cannot be uploaded
# to the Security tab. We therefore run the analysis with `upload: false` and
# publish the SARIF as a workflow artifact for manual review. The analysis
# still fails the build on extraction/analysis errors (it does NOT fail on
# findings — those live in the artifact, same as a normal CodeQL run).
#
# WHEN THE REPO GOES PUBLIC (or GHAS is enabled): set `upload: always` on the
# analyze step, add `security-events: write` to the job permissions, drop the
# upload-artifact step, and CodeQL alerts land in the Security tab and on PRs
# automatically. (This is the same COI-gated flip as OpenSSF Scorecard and
# cosign keyless — see ROADMAP §Maturity.)
#
# Pinning (CLAUDE.md §Dependency pinning): every `uses:` is SHA-pinned with a
# trailing tag comment.
name: CodeQL

on:
  # TEMPORARY (cost-saving during active development): the per-PR CodeQL run is
  # turned OFF and the analysis runs on an EVERY-3-DAYS schedule instead, to
  # conserve Actions minutes while the repo is changing rapidly. CodeQL is the
  # slowest job (~8-12 min) and runs in artifact mode (upload: false — private
  # repo / no GHAS), so there is no Security-tab baseline that needs per-PR
  # freshness. RESTORE the `pull_request` trigger (branches: [main], the
  # markdown/docs paths-ignore) when development slows; push-to-main stays dropped
  # (#143: a squash-merge re-scans an identical tree). workflow_dispatch allows an
  # on-demand run before a release or after a security-relevant change.
  schedule:
    # Every-3-days run catches regressions + new CodeQL queries / advisories. Was
    # weekly (cron "27 4 * * 1"); the per-PR trigger is dropped, so this runs on
    # days 1,4,7,…,28,31 (cron day-of-month step; resets at month boundaries).
    - cron: "27 4 */3 * *"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # codeql-action/analyze prechecks this scope even though `upload: never`
      # means nothing is actually pushed to Code Scanning (so no GHAS is
      # exercised on this private repo). Granting the scope is harmless; the
      # action just doesn't use it.
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Put the go.mod toolchain on PATH so CodeQL's Go autobuilder compiles
      # with the same version CI uses, not CodeQL's bundled Go.
      - if: matrix.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          # cache: false — measured regression. CodeQL's autobuild compiles via
          # its own extractor that does not reliably reuse the setup-go build
          # cache, so cache:true paid the cache-SAVE cost with no restore benefit
          # and made the Go analysis ~56% slower (~470s → ~740s). The real win is
          # the security-extended query suite below; the cache change is dropped.
          cache: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended keeps the thorough *security* query set but drops
          # the maintainability/quality queries (which overlap with go vet +
          # review) — the bulk of the per-run query-eval time. Faster scans on a
          # root-equivalent tool without losing security coverage.
          queries: security-extended
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
          # Private repo, no GHAS — see the header. `upload` is an enum
          # (always|failure-only|never), not a boolean; `never` keeps the SARIF
          # local (written to `output`) instead of pushing it to Code Scanning.
          # Flip to `always` when the repo is public / GHAS is enabled.
          upload: never
          upload-database: false
          output: sarif-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
          retention-days: 7

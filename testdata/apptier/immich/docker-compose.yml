# immich app-tier stack for scripts/apptier_verify.sh — the RELEASED images (no
# source build), wired like immich's own e2e compose, with the derived hardening
# applied to the leaf containers. This validates that immich still works after
# the container hardening, using its real API (see testdata/apptier/immich/verify.sh).
#
# The DB caps here are csd's DERIVED minimum for immich's postgres (deploy-check
# verdict: drop FOWNER from the declared set). Change these to re-test a different
# hardening — e.g. drop SETUID and the DB's privilege-drop fails and immich never
# comes up (the check then correctly FAILS).
name: immich-apptier
services:
  immich-server:
    container_name: immich-apptier-server
    image: ghcr.io/immich-app/immich-server:v3.0.1
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      IMMICH_ENV: testing
      IMMICH_PORT: '2285'
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - upload:/data
    depends_on:
      redis: {condition: service_started}
      database: {condition: service_healthy}
    ports:
      - 2285:2285

  redis:
    container_name: immich-apptier-redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    # redis's declared hardening (cap_drop ALL + a small cap_add for the startup drop).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    healthcheck: {test: redis-cli ping || exit 1}

  database:
    container_name: immich-apptier-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: immich}
    # csd DERIVED minimum for immich's postgres (declared set minus FOWNER).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  upload:

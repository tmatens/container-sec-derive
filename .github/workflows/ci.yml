# CI gate for container-sec-derive.
#
# v0.1 surface: vet + test + build, plus the IG version-pin parser
# replay that PLAN.md v1 success criterion 502 names. The replay is
# the regular Go test suite — TestRun_ExitCode_SchemaMismatchOnWrongIGVersion
# (exit_codes_test.go) constructs a fake ig binary that reports
# v0.50.0 and asserts csd exits with ExitSchemaMismatch and writes no
# sidecar. Existing fixture-replay tests (golden_test.go,
# main_test.go) cover the positive side of the pin against
# testdata/ig-versions/v0.51.0/.
#
# All third-party actions are SHA-pinned per CLAUDE.md
# §Dependency pinning. To bump: re-resolve the SHA from the action's
# git tag, update both the SHA and the trailing tag comment in the
# same commit.
name: ci
on:
  # PR-only: a squash-merge to main produces the same tree the PR already
  # validated, so a push-to-main re-run is pure duplication (#143). docs /
  # license / renovate changes can't affect vet/test/build, so skip them.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'renovate.json'
      - 'LICENSE'

# Cancel a superseded run when a PR is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Formatting is a hard gate: gofmt is deterministic and the tree is already
      # clean, so an unformatted file is always a mistake to reject at PR time
      # rather than let drift accumulate. Deeper linting (errcheck/staticcheck/
      # govet/ineffassign/unused via golangci-lint) runs in the `lint` job below.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The race detector guards the concurrent observe paths: every observer
      # spawns a stderr-drain goroutine over a shared lost-samples counter, and
      # the privileged observer runs two ig streams at once. The suite runs in
      # <0.1s, so the detector is near-free. (Needs cgo, on by default here.)
      - name: go test -race
        run: go test -race ./...
      # Golden-file drift guard (#296). A normal `go test` only READS the golden
      # sidecars; only -update-golden rewrites them. If that flag ever slips into
      # the test invocation (or a golden drifts), the run mutates a committed
      # file — fail loudly here instead of absorbing schema drift silently.
      - name: golden files unchanged by tests
        run: git diff --exit-code -- 'testdata/*golden*.json'
      - name: go build
        run: go build -o csd ./cmd/csd
      # Hermetic validation of the capability minimizer (greedy + #32
      # stabilization fixpoint, substitutability detection, verify_minimal) with
      # synthetic oracles — no Docker, so it belongs in the fast gate rather than
      # the dispatch-only ground-truth bisection.
      - name: bisect-caps minimizer self-test
        run: ./scripts/bisect_caps_selftest.sh
      # Hermetic guard test: drop_test.sh rejects a non-empty `fixed` (every
      # granted element must be a drop-tested candidate). Runs before any docker
      # work, so it belongs in the fast gate.
      - name: drop-test fixed-guard self-test
        run: ./scripts/drop_test_selftest.sh
      # Hermetic transform test: compose_to_spec.py carries tmpfs/read_only (and
      # mount/env) into the spec, so a container's cold-start asset creation
      # (chowning a fresh tmpfs data dir) is exercised and its caps derive
      # faithfully (#337). Pure python+yaml, no docker.
      - name: compose->spec transform self-test
        run: ./scripts/compose_derive_selftest.sh
      # Hermetic loop test: derive_profiles.sh's dimension->observer dispatch,
      # per-dimension canonicalizers, run_args/csd_args pass-through, and the
      # FRESH/REVALIDATE/CHANGED/WARN exit-code contract, with docker/sudo/csd
      # stubbed on PATH — no Docker, so it belongs in the fast gate.
      - name: derive-profiles loop self-test
        run: ./scripts/derive_profiles_selftest.sh

  # Deep static analysis beyond `go vet` (#292): errcheck / staticcheck /
  # ineffassign / unused, configured in .golangci.yml. A separate job so it runs
  # in parallel with the test gate and its failures read distinctly. Pinned to
  # the golangci-lint version the config was cleaned against, matching the local
  # `golangci-lint run` maintainers use.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

# drop-test spec: valkey read-only-filesystem tmpfs minimum. valkey stores its
# RDB/AOF in /data; unlike redis, the valkey image does NOT declare /data a
# VOLUME, so under --read-only it is supplied here via run.tmpfs as a writable
# stand-in for the persistent volume a real deployment mounts (NEVER tmpfs in
# production). Under a read-only rootfs with /data writable, valkey serves the
# PING + SET/GET round-trip with no additional tmpfs. /tmp is drop-tested and
# comes out NOT required. Minimum: read_only:true, tmpfs:[].
#
# Derived under the default docker cap set (so the setpriv drop + fresh-volume
# chown fire). Correctness reuses redis_deploy.sh (PING + SET/GET + non-root uid).
image: docker.io/valkey/valkey
tag: "9"
dimension: filesystem
base_fs: read_only
fixed: []
candidates: ["/tmp"]
run:
  tmpfs: ["/data"]
correctness: testdata/drop-test/correctness/redis_deploy.sh

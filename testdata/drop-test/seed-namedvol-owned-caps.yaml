# Correctly-owned control for csd#340 item 4 (see seed-namedvol-caps.yaml): the
# SAME chown-repair entrypoint against a mount pinned to the SERVICE uid (1000) via
# seed_mounts. The dir is already correctly owned, so the boot-time repair is a
# no-op and the drop-test derives CHOWN REMOVABLE. Contrast with the named-volume
# spec (worst-case foreign uid 9999 -> CHOWN needed): only the mount's initial
# OWNERSHIP differs, proving the derived cap tracks the volume's ownership and that
# a declared named volume is (correctly) staged worst-case rather than assumed
# already-owned. The smoke asserts CHOWN is PRESENT for the named volume and ABSENT
# here.
image: csd-seed-fidelity
tag: "0.1"
no_pull: true
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  env: ["CSD_SEED_OP=chown"]
  seed_mounts:
    - target: /data
      owner: "1000:1000"   # already the service uid -> repair is a no-op
correctness: testdata/drop-test/correctness/seed-fidelity.sh

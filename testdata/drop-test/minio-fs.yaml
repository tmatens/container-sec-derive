# drop-test spec: minio read-only-filesystem tmpfs minimum, single-node server.
# minio's only writes are to its object store /data — a persistent VOLUME
# (supplied here via run.tmpfs as a writable stand-in, NOT part of the derived
# tmpfs minimum). Under --read-only it serves the S3 make-bucket + put + get
# round-trip with no additional tmpfs. /tmp is drop-tested and comes out NOT
# required. Minimum: read_only:true, tmpfs:[].
#
# Derived under the default docker cap set (orthogonal to the zero-cap minimum).
# Correctness reuses minio.sh (an S3 round-trip via the pinned mc sidecar).
image: docker.io/minio/minio
tag: "RELEASE.2025-09-07T16-13-09Z"
dimension: filesystem
base_fs: read_only
fixed: []
candidates: ["/tmp"]
run:
  command: ["server", "/data"]
  env: [MINIO_ROOT_USER=csdadmin, MINIO_ROOT_PASSWORD=CsdProbe-Pw-12345]
  tmpfs: ["/data"]
correctness: testdata/drop-test/correctness/minio.sh

# drop-test spec: alloy (Grafana Alloy) minimum Linux capabilities. Added
# 2026-07-16 (container-security-profiles#63) so the catalog answers the
# CAPABILITY question for alloy alongside its filesystem profile.
#
# alloy is a non-root distroless service (uid 473) on the unprivileged :12345
# writing only to its storage.path — no capability is load-bearing. Expected
# minimum: []. Derived under the filesystem recommendation (read_only:true +
# the /var/lib/alloy parent stand-in at mode=1777 for uid 473).
image: docker.io/grafana/alloy
tag: v1.16.2
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  read_only: true
  tmpfs: ["/var/lib/alloy:mode=1777"]
  security_opt: ["no-new-privileges:true"]
correctness: testdata/drop-test/correctness/alloy.sh

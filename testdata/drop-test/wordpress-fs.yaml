# drop-test spec: wordpress read-only-filesystem tmpfs minimum. wordpress (Apache
# + PHP) copies WP core into /var/www/html on first run and stores uploads/config
# there — a declared VOLUME, auto-mounted writable (persistent in production,
# never tmpfs). Under --read-only the Apache runtime needs its pid/lock dir
# writable; /var/log/apache2 and /tmp are drop-tested too. Minimum derived below.
#
# Derived under the default docker cap set (so the source-copy chown + the
# master/worker www-data drop fire), with the in-stack mysql `db` dep (the
# wordpress install needs a live DB). Correctness reuses wordpress.sh.
image: docker.io/library/wordpress
tag: "6.9"
dimension: filesystem
base_fs: read_only
fixed: []
candidates: ["/var/run/apache2", "/var/log/apache2", "/tmp"]
deps:
  - name: db
    image: docker.io/library/mysql
    tag: "8.4"
    env: [MYSQL_ROOT_PASSWORD=csdprobe-root-pw-12345, MYSQL_DATABASE=wordpress,
          MYSQL_USER=wordpress, MYSQL_PASSWORD=csdprobe-pw-12345]
    ready: MYSQL_PWD=$MYSQL_PASSWORD mysql -u$MYSQL_USER $MYSQL_DATABASE -e "SELECT 1"
run:
  env: [WORDPRESS_DB_HOST=db, WORDPRESS_DB_USER=wordpress,
        WORDPRESS_DB_PASSWORD=csdprobe-pw-12345, WORDPRESS_DB_NAME=wordpress]
correctness: testdata/drop-test/correctness/wordpress.sh

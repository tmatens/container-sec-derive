# drop-test spec: syncthing minimum Linux capabilities, default invocation.
# Baseline is cap_drop:ALL + the full Docker default cap set on a fresh
# docker-managed /var/syncthing volume (declared VOLUME).
#
# Shape: the entrypoint starts as root, fixes ownership of /var/syncthing,
# and drops to the default PUID 1000 — expect the SETGID/SETUID startup pair
# plus whatever the ownership fix needs (CHOWN class; the drop-test decides).
# GUI/API on the unprivileged :8384; sync protocol on :22000.
#
# Correctness = REST against the API: read the generated API key from
# config.xml (exec as the syncthing uid — probe hygiene), assert
# system/status answers with a device ID, add a folder via
# PUT /rest/config/folders/csd, and read it back. The in-image curl is used
# (no sidecar needed).
image: docker.io/syncthing/syncthing
tag: "2.0"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  security_opt: ["no-new-privileges:true"]
correctness: testdata/drop-test/correctness/syncthing.sh

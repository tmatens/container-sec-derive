# drop-test spec: httpd (Apache) minimum Linux capabilities, default
# invocation. Baseline is cap_drop:ALL + the full Docker default cap set.
#
# The master/worker split shape (the caddy contrast): httpd's MASTER stays
# root and forks WORKERS that setuid/setgid to www-data (httpd.conf
# User/Group) — so unlike the gosu images (whole process drops, then serves),
# BOTH the low-port bind and the worker drop are load-bearing. Expected
# minimum: NET_BIND_SERVICE (bind :80 — pinned hardened sysctl posture, see
# below) + SETGID + SETUID (the worker drop).
#
# run.sysctls pins net.ipv4.ip_unprivileged_port_start=1024 (csd#340 item 5):
# docker defaults it to 0, where NET_BIND_SERVICE reads falsely-removable.
# The profile is valid only under the pinned posture.
#
# Correctness: GET / must return the default page body AND a worker must be
# running as www-data (uid assert on a non-root httpd process — the
# redis-class sharp edge: with SETUID/SETGID dropped, httpd 2.4 keeps serving
# with ROOT workers, so the content check alone false-passes; only the uid
# assert catches it).
image: docker.io/library/httpd
tag: "2.4"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  security_opt: ["no-new-privileges:true"]
  sysctls: ["net.ipv4.ip_unprivileged_port_start=1024"]
correctness: testdata/drop-test/correctness/httpd.sh

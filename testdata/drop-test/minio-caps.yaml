# drop-test spec: minio minimum Linux capabilities, default single-node
# invocation (`server /data`, root credentials via env). Baseline is
# cap_drop:ALL + the full Docker default cap set on a fresh docker-managed
# /data volume (declared VOLUME).
#
# minio's shape: a single static Go binary running AS ROOT with no privilege
# drop, serving the unprivileged :9000, all writes on its VOLUME — expected
# minimum [], the jellyfin-class zero-cap-as-root story. Immutable RELEASE.*
# tags (the queue's fit note).
#
# Correctness = a REAL S3 round-trip via the pinned `mc` client as a sidecar
# sharing the target's netns (the server image ships no client): make-bucket,
# pipe an object in, cat it back byte-identical. The MC_HOST_ env alias keeps
# the client config-free — no writes anywhere but the object store itself.
image: docker.io/minio/minio
tag: "RELEASE.2025-09-07T16-13-09Z"
dimension: capabilities
fixed: []
candidates: ["CHOWN", "DAC_OVERRIDE", "FSETID", "FOWNER", "MKNOD", "NET_RAW",
             "SETGID", "SETUID", "SETFCAP", "SETPCAP", "NET_BIND_SERVICE",
             "SYS_CHROOT", "KILL", "AUDIT_WRITE"]
run:
  command: ["server", "/data"]
  env: [MINIO_ROOT_USER=csdadmin, MINIO_ROOT_PASSWORD=CsdProbe-Pw-12345]
  security_opt: ["no-new-privileges:true"]
correctness: testdata/drop-test/correctness/minio.sh
